name: Check and release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: 4fl-ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  project:
    name: Validate project metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      product: ${{ steps.info.outputs.product }}
      initialized: ${{ steps.info.outputs.initialized }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - id: info
        name: Verify structure and initialization status
        run: python scripts/check_project.py --allow-template --github-output "$GITHUB_OUTPUT"

  version:
    name: Resolve GitVersion 6.8.2
    needs: project
    if: needs.project.outputs.initialized == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.gv.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: gv
        uses: 4FusionLab/.github/.github/actions/resolve-version@ad9d60ba4aabc494b4f2c85d6c566a50ca423751
        with:
          variable: MajorMinorPatch

  changes:
    name: Determine release eligibility
    needs: project
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.project.outputs.initialized == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release: ${{ steps.runtime.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: runtime
        uses: 4FusionLab/.github/.github/actions/runtime-changes@ad9d60ba4aabc494b4f2c85d6c566a50ca423751
        with:
          before: ${{ github.event.before }}
          after: ${{ github.sha }}
          paths-file: .github/release-paths.txt

  check:
    name: Offline test + package (${{ matrix.os }})
    needs: [project, version]
    if: >-
      always() && needs.project.result == 'success' &&
      (needs.version.result == 'success' || needs.version.result == 'skipped')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      ADDIN_NAME: ${{ needs.project.outputs.product }}
      PACKAGE_VERSION: ${{ needs.version.outputs.version || '0.1.0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Compile without Autodesk Fusion
        shell: bash
        run: python -m compileall -q "$ADDIN_NAME" scripts tests
      - name: Run unit and scaffolding tests
        run: python -m unittest discover -s tests -v
      - name: Generate reproducible Fusion ZIP and SHA-256
        shell: bash
        run: python scripts/build.py --version "$PACKAGE_VERSION" --allow-template
      - name: Validate package and embedded manifest
        uses: 4FusionLab/.github/.github/actions/verify-archive@ad9d60ba4aabc494b4f2c85d6c566a50ca423751
        with:
          product: ${{ needs.project.outputs.product }}
          version: ${{ needs.version.outputs.version || '0.1.0' }}
          archives: ${{ format('dist/{0}-{1}.zip', needs.project.outputs.product, needs.version.outputs.version || '0.1.0') }}
          manifest: ${{ format('{0}/{0}.manifest', needs.project.outputs.product) }}

  release:
    name: Publish immutable GitHub Release
    needs: [project, version, changes, check]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.project.outputs.initialized == 'true' &&
      needs.version.result == 'success' &&
      needs.changes.outputs.release == 'true' &&
      needs.check.result == 'success' &&
      !contains(github.event.head_commit.message, '[skip release]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: 4fl-publish
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      PRODUCT: ${{ needs.project.outputs.product }}
      VERSION: ${{ needs.version.outputs.version }}
      COMMIT: ${{ github.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Prepare notes from history or reviewed file
        uses: 4FusionLab/.github/.github/actions/release-notes@ad9d60ba4aabc494b4f2c85d6c566a50ca423751
        with:
          product: ${{ needs.project.outputs.product }}
          version: ${{ needs.version.outputs.version }}
          candidate: ${{ format('docs/releases/{0}.md', needs.version.outputs.version) }}
          output: ${{ runner.temp }}/release-notes.md
      - name: Package tested commit at resolved version
        shell: bash
        run: python scripts/build.py --version "$VERSION"
      - name: Verify final ZIP, checksum, manifest and notes
        uses: 4FusionLab/.github/.github/actions/verify-archive@ad9d60ba4aabc494b4f2c85d6c566a50ca423751
        with:
          product: ${{ needs.project.outputs.product }}
          version: ${{ needs.version.outputs.version }}
          archives: ${{ format('dist/{0}-{1}.zip', needs.project.outputs.product, needs.version.outputs.version) }}
          manifest: ${{ format('{0}/{0}.manifest', needs.project.outputs.product) }}
          notes: ${{ runner.temp }}/release-notes.md
      - name: Publish without replacing existing tags or assets
        shell: bash
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if git rev-parse -q --verify "refs/tags/$tag^{commit}" >/dev/null; then
            if [[ "$(git rev-parse "$tag^{commit}")" != "$COMMIT" ]]; then
              echo "Immutable tag $tag already points to another commit" >&2
              exit 1
            fi
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Already published $tag; leaving it unchanged"
            exit 0
          fi
          if git ls-remote --exit-code origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Tag $tag exists without a release; refusing to overwrite" >&2
            exit 1
          fi
          gh release create "$tag" "dist/$PRODUCT-$VERSION.zip" "dist/$PRODUCT-$VERSION.zip.sha256" \
            --target "$COMMIT" --title "$PRODUCT $tag" \
            --notes-file "$RUNNER_TEMP/release-notes.md" --latest

